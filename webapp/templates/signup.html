<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Diabetes Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1b4f72, #2e86c1, #1a8a7a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Poppins", sans-serif;
        }

        .signup-card {
            width: 450px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
            color: #1b2f3e;
        }

        .signup-card h2, .signup-card label, .signup-card p {
            color: #1b4f72;
        }

        .form-control {
            border: 2px solid #d6e4f0;
            background: #f4f9fd;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #2e86c1;
            box-shadow: 0 0 8px rgba(46, 134, 193, 0.35);
            background: #fff;
        }

        .btn-primary {
            background: linear-gradient(45deg, #1b4f72, #2e86c1);
            border: none;
            border-radius: 10px;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            opacity: 0.95;
        }

        a {
            color: #2e86c1;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="signup-card">
    <h2 class="text-center mb-3"><i class="fas fa-user-plus"></i> Create Account</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">
        <div class="mb-3">
            <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" class="form-control" name="email" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><i class="fas fa-lock"></i> Password</label>
            <input type="password" class="form-control" name="password" placeholder="Create password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Signup</button>
    </form>

    <p class="text-center mt-3">
        Already have an account? <a href="/login">Login</a>
    </p>
</div>

</body>
</html>
